# =====================================================================
# 星潮数码配件电子商城 - JDBC 数据库连接配置文件
# 说明：
# 1. 本地或云服务器已安装 MySQL 5.7 / 8.0 时，将 db.mode 设为 mysql 并配置账号密码即可连接 MySQL。
# 2. 默认 db.mode=auto：优先尝试连接配置的本地 MySQL（若通过环境变量 DB_URL 指定则直接使用）；
#    当检测到运行环境未启动外部 MySQL 服务时，自动切换至兼容 MySQL 语法的内置 JDBC 持久化库，确保零配置开箱即用。
# =====================================================================
db.mode=auto
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://127.0.0.1:3306/digital_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
mysql.username=root
mysql.password=123456
